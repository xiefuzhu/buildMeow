name: Windows build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Installer version (for example 1.0.0-beta.3)'
        default: '1.0.0-beta.3'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - name: Resolve core dependencies
        working-directory: packages/mapart_core
        run: |
          dart pub get
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Resolve app dependencies
        working-directory: app
        run: |
          flutter pub get
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Analyze and test core
        working-directory: packages/mapart_core
        run: |
          dart analyze
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dart test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Analyze and test app
        working-directory: app
        run: |
          flutter analyze --no-pub
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./tool/run_tests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install Inno Setup
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build release bundle and installer
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
          } elseif ($env:REQUESTED_VERSION) {
            $version = $env:REQUESTED_VERSION
          } else {
            $version = '1.0.0-beta.3'
          }
          & ./app/tool/build_release.ps1 -AppVersion $version -BuildNumber $env:GITHUB_RUN_NUMBER -Compiler "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe"
      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BuildMeow-windows-x64
          path: app/build/installers/*
          if-no-files-found: error
          retention-days: 14
      - name: Preserve test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-logs
          path: app/build/test_logs/
          if-no-files-found: ignore
          retention-days: 14

  publish:
    if: startsWith(github.ref, 'refs/tags/') && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: BuildMeow-windows-x64
          path: release
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release/* --verify-tag --prerelease --title "BuildMeow $RELEASE_TAG" --generate-notes
